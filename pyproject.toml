[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(\.git|\.venv|venv|build|dist)/
'''

[tool.isort]
profile = "black"
line_length = 88
py_version = 310

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
exclude = [".git", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
# Keep line wrapping with Black; Ruff checks the remaining standard error rules.
select = ["E4", "E7", "E9", "F", "I"]
