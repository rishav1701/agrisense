[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py310"]
include = "\\.pyi?$"
exclude = '''
/(\.git|\.venv|venv|build|dist)/
'''

[tool.isort]
profile = "black"
line_length = 88
py_version = 310
known_first_party = ["src", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
exclude = [".git", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
